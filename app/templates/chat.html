<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Soravisi SQL Chat - Powered by DeepSeek</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
          Cantarell, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .container {
        width: 100%;
        max-width: 900px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        display: flex;
        flex-direction: column;
        height: 90vh;
        max-height: 700px;
      }

      .header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 20px;
        border-radius: 12px 12px 0 0;
        text-align: center;
      }

      .header h1 {
        font-size: 24px;
        margin-bottom: 5px;
      }

      .header p {
        font-size: 14px;
        opacity: 0.9;
      }

      .chat-area {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        background: #f8f9fa;
        display: flex;
        flex-direction: column;
        gap: 15px;
      }

      .message {
        display: flex;
        gap: 10px;
        animation: slideIn 0.3s ease-out;
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .message.user {
        justify-content: flex-end;
      }

      .message-content {
        max-width: 70%;
        padding: 12px 16px;
        border-radius: 12px;
        word-wrap: break-word;
      }

      .message.user .message-content {
        background: #667eea;
        color: white;
        border-radius: 12px 4px 12px 12px;
      }

      .message.assistant .message-content {
        background: #e9ecef;
        color: #333;
        border-radius: 4px 12px 12px 12px;
      }

      .sql-block {
        background: #1e1e1e;
        color: #d4d4d4;
        padding: 12px;
        border-radius: 8px;
        font-family: "Courier New", monospace;
        font-size: 12px;
        overflow-x: auto;
        margin-top: 10px;
      }

      .results-block {
        background: #f1f3f5;
        border: 1px solid #dee2e6;
        padding: 12px;
        border-radius: 8px;
        margin-top: 10px;
        font-size: 13px;
      }

      .results-block table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }

      .results-block th,
      .results-block td {
        padding: 8px;
        text-align: left;
        border-bottom: 1px solid #dee2e6;
      }

      .results-block th {
        background: #e9ecef;
        font-weight: 600;
      }

      .input-area {
        padding: 20px;
        border-top: 1px solid #dee2e6;
        display: flex;
        gap: 10px;
      }

      .input-group {
        flex: 1;
        display: flex;
        gap: 10px;
      }

      input[type="text"] {
        flex: 1;
        padding: 12px 16px;
        border: 1px solid #dee2e6;
        border-radius: 8px;
        font-size: 14px;
        font-family: inherit;
        transition: all 0.2s;
      }

      input[type="text"]:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      }

      button {
        padding: 12px 24px;
        background: #667eea;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      button:hover {
        background: #764ba2;
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
      }

      button:active {
        transform: translateY(0);
      }

      button:disabled {
        background: #ccc;
        cursor: not-allowed;
        transform: none;
      }

      .checkbox-group {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-left: auto;
      }

      .checkbox-group label {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 14px;
        cursor: pointer;
      }

      .checkbox-group input[type="checkbox"] {
        cursor: pointer;
        width: 18px;
        height: 18px;
      }

      .loading {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #666;
      }

      .spinner {
        width: 16px;
        height: 16px;
        border: 2px solid #667eea;
        border-top-color: transparent;
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .error {
        background: #f8d7da;
        color: #721c24;
        padding: 12px 16px;
        border-radius: 8px;
        border-left: 4px solid #f5c6cb;
      }

      .copy-button {
        background: #6c757d;
        padding: 6px 12px;
        font-size: 12px;
        margin-top: 8px;
      }

      .copy-button:hover {
        background: #5a6268;
      }

      .info-section {
        padding: 20px;
        text-align: center;
        color: #666;
      }

      .info-section h2 {
        color: #333;
        margin-bottom: 10px;
      }

      .info-section p {
        font-size: 14px;
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>🗨️ Soravisi SQL Chat</h1>
        <p
          >Ask questions in natural language, get SQL queries powered by
          DeepSeek AI</p
        >
      </div>

      <div class="chat-area" id="chatArea">
        <div class="info-section">
          <h2>Welcome to Soravisi SQL Chat</h2>
          <p>Ask me questions about your database in natural language.</p>
          <p style="font-size: 12px; color: #999">
            Examples: "How many employees are there?", "Show me top 10 users by
            join date"
          </p>
        </div>
      </div>

      <div class="input-area">
        <div class="input-group">
          <input
            type="text"
            id="questionInput"
            placeholder="Ask a question about the database..."
            onkeypress="handleKeyPress(event)"
          />
          <button onclick="sendMessage()" id="sendButton"> Send </button>
        </div>
        <div class="checkbox-group">
          <label>
            <input type="checkbox" id="executeCheckbox" checked />
            Execute
          </label>
        </div>
      </div>
    </div>

    <script>
      const chatArea = document.getElementById("chatArea");
      const questionInput = document.getElementById("questionInput");
      const sendButton = document.getElementById("sendButton");
      const executeCheckbox = document.getElementById("executeCheckbox");

      let isLoading = false;

      function scrollToBottom() {
        chatArea.scrollTop = chatArea.scrollHeight;
      }

      function addMessage(text, isUser = false, isHTML = false) {
        const messageDiv = document.createElement("div");
        messageDiv.className = `message ${isUser ? "user" : "assistant"}`;

        const contentDiv = document.createElement("div");
        contentDiv.className = "message-content";

        if (isHTML) {
          contentDiv.innerHTML = text;
        } else {
          contentDiv.textContent = text;
        }

        messageDiv.appendChild(contentDiv);
        chatArea.appendChild(messageDiv);
        scrollToBottom();
      }

      function addLoading() {
        const messageDiv = document.createElement("div");
        messageDiv.className = "message assistant";
        messageDiv.id = "loadingMessage";

        const contentDiv = document.createElement("div");
        contentDiv.className = "message-content loading";
        contentDiv.innerHTML = '<div class="spinner"></div> Generating SQL...';

        messageDiv.appendChild(contentDiv);
        chatArea.appendChild(messageDiv);
        scrollToBottom();
      }

      function removeLoading() {
        const loadingMsg = document.getElementById("loadingMessage");
        if (loadingMsg) loadingMsg.remove();
      }

      function formatSQL(sql) {
        return `<div class="sql-block">${escapeHtml(sql)}</div>`;
      }

      function formatResults(results) {
        if (!results || results.length === 0) {
          return '<div class="results-block">No results found</div>';
        }

        const keys = Object.keys(results[0]);
        let html = '<div class="results-block"><table>';

        // Header
        html += "<thead><tr>";
        keys.forEach((key) => {
          html += `<th>${escapeHtml(key)}</th>`;
        });
        html += "</tr></thead><tbody>";

        // Rows
        results.forEach((row) => {
          html += "<tr>";
          keys.forEach((key) => {
            html += `<td>${escapeHtml(String(row[key]))}</td>`;
          });
          html += "</tr>";
        });

        html += "</tbody></table></div>";
        return html;
      }

      function escapeHtml(text) {
        const map = {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;",
        };
        return text.replace(/[&<>"']/g, (m) => map[m]);
      }

      async function sendMessage() {
        const question = questionInput.value.trim();

        if (!question) {
          alert("Please enter a question");
          return;
        }

        if (isLoading) return;

        isLoading = true;
        sendButton.disabled = true;

        // Clear input
        questionInput.value = "";

        // Add user message
        addMessage(question, true);
        addLoading();

        try {
          const response = await fetch("/api/chat", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              question: question,
              execute: executeCheckbox.checked,
            }),
          });

          removeLoading();

          const data = await response.json();

          if (data.success) {
            // Add SQL
            if (data.sql) {
              addMessage(
                `<strong>Generated SQL:</strong>${formatSQL(data.sql)}`,
                false,
                true,
              );
            }

            // Add results if executed
            if (data.executed && data.results) {
              addMessage(
                `<strong>Results (${data.results.length} rows):</strong>${formatResults(data.results)}`,
                false,
                true,
              );
            } else if (executeCheckbox.checked) {
              addMessage("Query executed but returned no results", false);
            }
          } else {
            addMessage(`Error: ${data.error}`, false);
          }
        } catch (error) {
          removeLoading();
          addMessage(`Network error: ${error.message}`, false);
        } finally {
          isLoading = false;
          sendButton.disabled = false;
          questionInput.focus();
        }
      }

      function handleKeyPress(event) {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          sendMessage();
        }
      }

      // Focus input on load
      window.addEventListener("load", () => {
        questionInput.focus();
      });
    </script>
  </body>
</html>
